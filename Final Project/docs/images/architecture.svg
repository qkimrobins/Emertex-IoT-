<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/><stop offset="1" stop-color="#070b16"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1240" height="700" fill="url(#bg)"/>
  <text x="620" y="46" text-anchor="middle" fill="#e6edf7" font-size="26" font-weight="700">Smart Edge-AI EV Charging Station Optimizer — Architecture</text>
  <text x="620" y="72" text-anchor="middle" fill="#7e8db0" font-size="14">ESP32 (Wokwi) &#160;·&#160; MQTT &#160;·&#160; ThingsBoard &#160;·&#160; Edge-AI &#160;·&#160; Web Dashboard</text>

  <!-- ============ LEFT: edge device ============ -->
  <rect x="40" y="110" width="330" height="470" rx="16" fill="#10182b" stroke="#3b4a6b" stroke-width="1.5"/>
  <text x="205" y="142" text-anchor="middle" fill="#22d3ee" font-size="16" font-weight="700">EDGE DEVICE — ESP32 (Wokwi)</text>

  <rect x="62" y="162" width="286" height="78" rx="10" fill="#0d1526" stroke="#24406b" stroke-width="1" opacity="0"/>
  <rect x="62" y="162" width="286" height="76" rx="10" fill="#0d1526" stroke="#24406b" stroke-width="1"/>
  <text x="205" y="186" text-anchor="middle" fill="#e6edf7" font-size="13" font-weight="600">3-Bay Electrical Simulator</text>
  <text x="205" y="206" text-anchor="middle" fill="#7e8db0" font-size="11.5">voltage · current · temperature · SoC</text>
  <text x="205" y="224" text-anchor="middle" fill="#7e8db0" font-size="11.5">power &amp; energy · EV plug-in/out · CC/CV taper</text>

  <rect x="62" y="252" width="286" height="76" rx="10" fill="#0d1526" stroke="#24406b" stroke-width="1"/>
  <text x="205" y="276" text-anchor="middle" fill="#e6edf7" font-size="13" font-weight="600">Edge-AI Inference (on-device)</text>
  <text x="205" y="296" text-anchor="middle" fill="#7e8db0" font-size="11.5">arrival probability (Logistic Regression)</text>
  <text x="205" y="314" text-anchor="middle" fill="#7e8db0" font-size="11.5">charging duration (Decision Tree, C arrays)</text>

  <rect x="62" y="342" width="286" height="76" rx="10" fill="#0d1526" stroke="#24406b" stroke-width="1"/>
  <text x="205" y="366" text-anchor="middle" fill="#e6edf7" font-size="13" font-weight="600">Optimizer ALLOW / THROTTLE / DEFER</text>
  <text x="205" y="386" text-anchor="middle" fill="#7e8db0" font-size="11.5">safety thresholds (temp 55/65/80 °C)</text>
  <text x="205" y="404" text-anchor="middle" fill="#7e8db0" font-size="11.5">predictive reserve · priority-based current ratioing</text>

  <rect x="62" y="432" width="286" height="70" rx="10" fill="#0d1526" stroke="#24406b" stroke-width="1"/>
  <text x="205" y="456" text-anchor="middle" fill="#e6edf7" font-size="13" font-weight="600">MQTT client (PubSubClient)</text>
  <text x="205" y="476" text-anchor="middle" fill="#7e8db0" font-size="11.5">telemetry · RPC · shared attributes</text>
  <text x="205" y="492" text-anchor="middle" fill="#7e8db0" font-size="11.5">+ OLED status screen &amp; bay LEDs</text>

  <!-- ============ CENTER: brokers ============ -->
  <rect x="440" y="120" width="300" height="130" rx="14" fill="#10182b" stroke="#3b4a6b" stroke-width="1.5"/>
  <text x="590" y="150" text-anchor="middle" fill="#34d399" font-size="15" font-weight="700">MQTT BROKER</text>
  <text x="590" y="172" text-anchor="middle" fill="#7e8db0" font-size="11.5">public mirror: broker.emqx.io (1883)</text>
  <text x="590" y="192" text-anchor="middle" fill="#7e8db0" font-size="11.5">emx/ev/telemetry · emx/ev/cmd</text>
  <text x="590" y="212" text-anchor="middle" fill="#7e8db0" font-size="11.5">attr/state · status · cmd/ack</text>
  <text x="590" y="234" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="600">WebSocket 8084 for the dashboard</text>

  <rect x="470" y="280" width="240" height="110" rx="14" fill="#10182b" stroke="#3b4a6b" stroke-width="1.5"/>
  <text x="590" y="308" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="700">ThingsBoard</text>
  <text x="590" y="328" text-anchor="middle" fill="#7e8db0" font-size="11.5">v1/devices/me/telemetry</text>
  <text x="590" y="346" text-anchor="middle" fill="#7e8db0" font-size="11.5">rpc/request · rpc/response</text>
  <text x="590" y="364" text-anchor="middle" fill="#7e8db0" font-size="11.5">attributes (shared + client)</text>

  <!-- ============ RIGHT: dashboard + training ============ -->
  <rect x="820" y="110" width="380" height="150" rx="14" fill="#10182b" stroke="#3b4a6b" stroke-width="1.5"/>
  <text x="1010" y="140" text-anchor="middle" fill="#a78bfa" font-size="15" font-weight="700">WEB DASHBOARD (browser)</text>
  <text x="1010" y="162" text-anchor="middle" fill="#7e8db0" font-size="11.5">MQTT.js over WebSocket · dark IoT/energy UI</text>
  <text x="1010" y="182" text-anchor="middle" fill="#7e8db0" font-size="11.5">live gauges · charts · bay status · AI cards</text>
  <text x="1010" y="202" text-anchor="middle" fill="#7e8db0" font-size="11.5">optimization decisions · alarms</text>
  <text x="1010" y="222" text-anchor="middle" fill="#7e8db0" font-size="11.5">manual controls (plug-in/out, mode, limits)</text>
  <text x="1010" y="244" text-anchor="middle" fill="#34d399" font-size="11" font-weight="600">DEMO FEED fallback (offline-safe)</text>

  <rect x="820" y="290" width="380" height="150" rx="14" fill="#10182b" stroke="#3b4a6b" stroke-width="1.5"/>
  <text x="1010" y="318" text-anchor="middle" fill="#fbbf24" font-size="15" font-weight="700">AI TRAINING PIPELINE (Python)</text>
  <text x="1010" y="340" text-anchor="middle" fill="#7e8db0" font-size="11.5">ai/generate_data.py → synthetic datasets</text>
  <text x="1010" y="360" text-anchor="middle" fill="#7e8db0" font-size="11.5">ai/train_models.py → scikit-learn models</text>
  <text x="1010" y="380" text-anchor="middle" fill="#7e8db0" font-size="11.5">export → models.h (C arrays) → firmware</text>
  <text x="1010" y="400" text-anchor="middle" fill="#7e8db0" font-size="11.5">optimizer/optimizer.py → Python reference</text>
  <text x="1010" y="420" text-anchor="middle" fill="#7e8db0" font-size="11.5">scripts/live_demo.py → hardware-free demo</text>

  <!-- ============ ARROWS ============ -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#22d3ee"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#34d399"/>
    </marker>
    <marker id="arrw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#fbbf24"/>
    </marker>
  </defs>

  <line x1="348" y1="467" x2="435" y2="180" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrg)"/>
  <text x="360" y="330" fill="#34d399" font-size="11">telemetry JSON</text>

  <line x1="470" y1="335" x2="540" y2="335" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arr)" stroke-dasharray="6 4"/>
  <text x="430" y="325" fill="#22d3ee" font-size="11">RPC / attrs</text>

  <line x1="740" y1="180" x2="815" y2="180" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrg)"/>
  <text x="742" y="172" fill="#34d399" font-size="11">subscribe telemetry</text>
  <line x1="815" y1="200" x2="740" y2="200" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arr)" stroke-dasharray="6 4"/>
  <text x="745" y="222" fill="#22d3ee" font-size="11">commands</text>

  <line x1="820" y1="365" x2="352" y2="290" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrw)"/>
  <text x="520" y="452" fill="#fbbf24" font-size="11">models.h (C arrays) baked into firmware</text>

  <!-- legend -->
  <rect x="440" y="560" width="360" height="90" rx="12" fill="#10182b" stroke="#3b4a6b" stroke-width="1"/>
  <text x="620" y="584" text-anchor="middle" fill="#e6edf7" font-size="13" font-weight="600">Data flow</text>
  <text x="460" y="608" fill="#7e8db0" font-size="11.5">1 · device simulates sensors + runs Edge-AI + optimizer</text>
  <text x="460" y="628" fill="#7e8db0" font-size="11.5">2 · telemetry → ThingsBoard + mirror broker (dashboard)</text>
  <text x="460" y="646" fill="#7e8db0" font-size="11.5">3 · dashboard controls → RPC (TB) or emx/ev/cmd (mirror)</text>
</svg>